<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemixWorld重构世界</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0b0e14;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e8edf5;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.light-mode {
            background: #f0f2f5;
            color: #1a1d23;
        }

        body.light-mode .slogan {
            color: rgba(26, 29, 35, 0.6);
        }

        body.light-mode .footer {
            border-top-color: rgba(0, 0, 0, 0.06);
        }

        body.light-mode .footer-copy {
            color: rgba(26, 29, 35, 0.15);
        }

        body.light-mode .theme-toggle {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.08);
            color: #1a1d23;
        }

        body.light-mode .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        body.light-mode .logo-text-svg {
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.06));
        }

        /* 主题切换按钮 - 带圆角矩形背景 */
        body.light-mode .theme-toggle-wrapper {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.08);
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
        }

        /* 左上角图标 */
        .top-left-icon {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 10;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .top-left-icon svg {
            width: 40px;
            height: auto;
            display: block;
            transition: all 0.5s ease;
        }

        .top-left-icon svg path {
            stroke: #ffffff;
            transition: stroke 0.5s ease;
        }

        body.light-mode .top-left-icon svg path {
            stroke: #000000;
        }

        /* 右上角主题切换 - 带圆角矩形背景 */
        .theme-toggle-wrapper {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 6px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .theme-toggle-wrapper:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: transparent;
            border: none;
            color: #e8edf5;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        body.light-mode .theme-toggle-wrapper {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.08);
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            width: 100%;
            text-align: center;
            user-select: none;
            flex: 1;
        }

        .logo-text-svg {
            width: clamp(320px, 70vw, 800px);
            height: auto;
            display: block;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.04));
            transition: transform 0.3s ease, filter 0.5s ease;
        }

        .slogan {
            margin-top: 1.5rem;
            font-size: clamp(1.1rem, 2.8vw, 2rem);
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.08em;
            color: rgba(232, 237, 245, 0.6);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.04);
            transition: color 0.5s ease;
            line-height: 1.6;
        }

        .slogan .quote {
            color: rgba(232, 237, 245, 0.4);
        }

        .footer {
            width: 100%;
            max-width: 820px;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            transition: border-color 0.5s ease;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.5rem;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            transition: color 0.3s ease, transform 0.3s ease;
            position: relative;
        }

        .footer-links a:hover {
            color: rgba(255, 255, 255, 0.7);
            transform: translateY(-1px);
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: currentColor;
            transition: width 0.3s ease;
        }

        .footer-links a:hover::after {
            width: 100%;
        }

        body.light-mode .footer-links a {
            color: rgba(26, 29, 35, 0.3);
        }

        body.light-mode .footer-links a:hover {
            color: rgba(26, 29, 35, 0.7);
        }

        .footer-copy {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.1em;
            font-weight: 300;
            transition: color 0.5s ease;
        }

        @media (max-width: 600px) {
            .main-wrapper {
                padding: 1.5rem 1rem 3rem;
            }
            .hero-section {
                min-height: 65vh;
            }
            .top-left-icon {
                top: 1rem;
                left: 1rem;
                width: 36px;
                height: 36px;
            }
            .top-left-icon svg {
                width: 30px;
            }
            .theme-toggle-wrapper {
                top: 1rem;
                right: 1rem;
                padding: 4px;
                border-radius: 12px;
            }
            .theme-toggle {
                width: 38px;
                height: 38px;
                border-radius: 10px;
            }
            .theme-toggle svg {
                width: 19px;
                height: 19px;
            }
            .footer-links {
                gap: 1.5rem;
            }
            .footer-links a {
                font-size: 0.75rem;
            }
            .slogan {
                font-size: clamp(0.9rem, 2.5vw, 1.3rem);
                letter-spacing: 0.06em;
            }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>


    <!-- 右上角主题切换 - 带圆角矩形背景 -->
    <div class="theme-toggle-wrapper">
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
            <svg id="moonIcon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg id="sunIcon" viewBox="0 0 24 24" style="display: none;">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </div>

    <div class="main-wrapper">

        <section class="hero-section">
            <!-- 中间标识 - RemixWorld -->
            <svg class="logo-text-svg" id="logoSvg" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0,0,540.83939,100.5" preserveAspectRatio="xMidYMid meet">
                <g transform="translate(31.08939,-129.25)">
                    <g fill="#000000" stroke="#000000" stroke-width="0.5" stroke-linejoin="round" stroke-miterlimit="10">
                        <path d="M19.5,129.5h50l-50,50z"></path>
                        <path d="M69.5,129.5v50h-50z"></path>
                        <path d="M69.5,229.5h-50v-50z"></path>
                        <path d="M-30.5,129.5h50v50z"></path>
                        <g>
                            <path d="M129.5,129.5h50l-50,50z"></path>
                            <path d="M179.5,129.5v50h-50z"></path>
                            <path d="M179.5,229.5h-50v-50z"></path>
                            <path d="M129.5,229.5h-50l50,-50z"></path>
                            <path d="M79.5,229.5v-50h50z"></path>
                            <path d="M79.5,179.5v-50l50,50z"></path>
                            <path d="M79.5,129.5h50v50z"></path>
                        </g>
                        <g>
                            <path d="M239.5,129.5h50l-50,50z"></path>
                            <path d="M289.5,129.5v50h-50z"></path>
                            <path d="M289.5,179.5v50l-50,-50z"></path>
                            <path d="M189.5,229.5v-50h50z"></path>
                            <path d="M189.5,179.5v-50l50,50z"></path>
                            <path d="M189.5,129.5h50v50z"></path>
                        </g>
                        <g>
                            <path d="M349.5,129.5h50l-50,50z"></path>
                            <path d="M399.5,129.5v50h-50z"></path>
                            <path d="M399.5,179.5v50l-50,-50z"></path>
                            <path d="M399.5,229.5h-50v-50z"></path>
                            <path d="M299.5,129.5h50v50z"></path>
                        </g>
                        <g>
                            <path d="M509.5,129.5v50h-50z"></path>
                            <path d="M509.5,179.5v50l-50,-50z"></path>
                            <path d="M409.5,229.5v-50h50z"></path>
                            <path d="M409.5,179.5v-50l50,50z"></path>
                        </g>
                        <path d="M-30.83938,179.30487h50v50z"></path>
                    </g>
                </g>
            </svg>
            <!--rotationCenter:271.089385:50.75-->

            <div class="slogan">
                <span class="quote">"</span>人民世界人民造，重构世界为人民<span class="quote">"</span>
            </div>
        </section>

        <!-- 页脚 -->
        <footer class="footer">
            <div class="footer-links">
                <a href="rw.html" target="_blank" rel="noopener noreferrer">RemixWarp</a>
                <a href="https://remixgh2fa.pages.dev/" target="_blank" rel="noopener noreferrer">Remixgh2fa</a>
            </div>
            <div class="footer-copy">RemixWorld · 重构世界</div>
        </footer>

    </div>

    <script>
        (function() {
            // ---- 粒子背景 ----
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 70;
            const COLOR = '#75c1c4';
            const MAX_SPEED = 1.4;
            const MIN_SPEED = 0.3;
            const MAX_RADIUS = 4.0;
            const MIN_RADIUS = 1.2;
            const LIFE_SPAN = 200;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                initParticles(true);
            }

            class Particle {
                constructor(init = false) {
                    this.reset(init);
                }

                reset(init = false) {
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const spread = 40;
                    this.x = centerX + (Math.random() - 0.5) * spread;
                    this.y = centerY + (Math.random() - 0.5) * spread;

                    const angle = Math.random() * 2 * Math.PI;
                    const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;

                    this.radius = MIN_RADIUS + Math.random() * (MAX_RADIUS - MIN_RADIUS);
                    this.life = init ? Math.floor(Math.random() * LIFE_SPAN) : 0;
                    this.maxLife = LIFE_SPAN + Math.floor(Math.random() * 50);
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    this.vx += (Math.random() - 0.5) * 0.03;
                    this.vy += (Math.random() - 0.5) * 0.03;
                    const sp = Math.hypot(this.vx, this.vy);
                    if (sp > MAX_SPEED * 1.6) {
                        this.vx = (this.vx / sp) * MAX_SPEED * 1.2;
                        this.vy = (this.vy / sp) * MAX_SPEED * 1.2;
                    }

                    this.life++;
                    const margin = 120;
                    if (this.life > this.maxLife ||
                        this.x < -margin || this.x > width + margin ||
                        this.y < -margin || this.y > height + margin) {
                        this.reset(false);
                    }
                }

                draw() {
                    const progress = this.life / this.maxLife;
                    let alpha;
                    if (progress < 0.15) {
                        alpha = progress / 0.15;
                    } else {
                        alpha = 1 - (progress - 0.15) / 0.85;
                    }
                    alpha = Math.min(1, Math.max(0, alpha)) * 0.8;

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = COLOR;
                    ctx.globalAlpha = alpha;
                    ctx.fill();
                    if (this.radius > 2.5) {
                        ctx.shadowColor = COLOR;
                        ctx.shadowBlur = 8;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    ctx.globalAlpha = 1.0;
                }
            }

            function initParticles(forceReset = false) {
                if (forceReset || particles.length === 0) {
                    particles = [];
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        particles.push(new Particle(true));
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let p of particles) {
                    p.update();
                    p.draw();
                }
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            resize();
            animate();

            // ---- 主题切换功能 ----
            const toggleBtn = document.getElementById('themeToggle');
            const moonIcon = document.getElementById('moonIcon');
            const sunIcon = document.getElementById('sunIcon');
            const body = document.body;

            // 获取左上角图标和文字SVG
            const topIconSvg = document.querySelector('.top-left-icon svg');
            const textLogoSvg = document.getElementById('logoSvg');

            function updateSvgColors(isLightMode) {
                const color = isLightMode ? '#000000' : '#ffffff';
                
                // 更新左上角图标
                const iconPaths = topIconSvg.querySelectorAll('path');
                iconPaths.forEach(path => {
                    if (path.hasAttribute('stroke')) {
                        path.setAttribute('stroke', color);
                    }
                });
                const iconGroups = topIconSvg.querySelectorAll('g');
                iconGroups.forEach(g => {
                    if (g.hasAttribute('stroke')) {
                        g.setAttribute('stroke', color);
                    }
                });

                // 更新文字标识
                const textPaths = textLogoSvg.querySelectorAll('path');
                textPaths.forEach(path => {
                    if (path.hasAttribute('stroke')) {
                        path.setAttribute('stroke', color);
                    }
                    if (path.hasAttribute('fill')) {
                        path.setAttribute('fill', color);
                    }
                });
                const textGroups = textLogoSvg.querySelectorAll('g');
                textGroups.forEach(g => {
                    if (g.hasAttribute('stroke')) {
                        g.setAttribute('stroke', color);
                    }
                    if (g.hasAttribute('fill')) {
                        g.setAttribute('fill', color);
                    }
                });
            }

            let isLightMode = false;

            function toggleTheme() {
                isLightMode = !isLightMode;
                
                body.classList.toggle('light-mode', isLightMode);
                updateSvgColors(isLightMode);
                
                if (isLightMode) {
                    moonIcon.style.display = 'none';
                    sunIcon.style.display = 'block';
                } else {
                    moonIcon.style.display = 'block';
                    sunIcon.style.display = 'none';
                }
            }

            toggleBtn.addEventListener('click', toggleTheme);
            updateSvgColors(false);

        })();
    </script>

</body>
</html>
