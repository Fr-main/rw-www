<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemixWarp · 重构自由度</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0b0e14;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e8edf5;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.light-mode {
            background: #f0f2f5;
            color: #1a1d23;
        }

        body.light-mode .slogan {
            color: rgba(26, 29, 35, 0.6);
        }

        body.light-mode .showcase-item {
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.08);
        }

        body.light-mode .showcase-item:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        body.light-mode .showcase-item h4 {
            color: rgba(26, 29, 35, 0.8);
        }

        body.light-mode .showcase-item p {
            color: rgba(26, 29, 35, 0.4);
        }

        body.light-mode .showcase-title {
            color: rgba(26, 29, 35, 0.3);
        }

        body.light-mode .showcase-section {
            border-top-color: rgba(0, 0, 0, 0.08);
        }

        body.light-mode .footer {
            border-top-color: rgba(0, 0, 0, 0.06);
        }

        body.light-mode .footer-copy {
            color: rgba(26, 29, 35, 0.15);
        }

        body.light-mode .theme-toggle {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.08);
            color: #1a1d23;
        }

        body.light-mode .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        body.light-mode .logo-text-svg {
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.06));
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            padding: 2rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
        }

        /* 左上角图标 */
        .top-left-icon {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 10;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .top-left-icon svg {
            width: 40px;
            height: auto;
            display: block;
            transition: all 0.5s ease;
        }

        .top-left-icon svg path {
            stroke: #ffffff;
            transition: stroke 0.5s ease;
        }

        body.light-mode .top-left-icon svg path {
            stroke: #000000;
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            width: 100%;
            text-align: center;
            user-select: none;
            flex: 1;
        }

        .logo-text-svg {
            width: clamp(300px, 65vw, 750px);
            height: auto;
            display: block;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.04));
            transition: transform 0.3s ease, filter 0.5s ease;
        }

        .slogan {
            margin-top: 1.2rem;
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            font-weight: 300;
            letter-spacing: 0.35em;
            color: rgba(232, 237, 245, 0.55);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.04);
            transition: color 0.5s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e8edf5;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: scale(1.05);
        }

        .theme-toggle svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        body.light-mode .theme-toggle {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.08);
            color: #1a1d23;
        }

        body.light-mode .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .showcase-section {
            width: 100%;
            max-width: 820px;
            margin: 2rem auto;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            transition: border-color 0.5s ease;
        }

        .showcase-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
            transition: color 0.5s ease;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            width: 100%;
        }

        .showcase-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 1.2rem;
            padding: 1.5rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: all 0.3s ease;
        }

        .showcase-item:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        .showcase-item .icon {
            display: block;
            margin-bottom: 0.6rem;
            width: 32px;
            height: 32px;
            margin-left: auto;
            margin-right: auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7;
            color: rgba(232, 237, 245, 0.7);
        }

        body.light-mode .showcase-item .icon {
            color: rgba(26, 29, 35, 0.6);
        }

        .showcase-item h4 {
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(232, 237, 245, 0.7);
            letter-spacing: 0.02em;
            transition: color 0.5s ease;
        }

        .showcase-item p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 0.2rem;
            font-weight: 300;
            transition: color 0.5s ease;
        }

        .footer {
            width: 100%;
            max-width: 820px;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            transition: border-color 0.5s ease;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.8rem;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            transition: color 0.3s ease, transform 0.3s ease;
            position: relative;
        }

        .footer-links a:hover {
            color: rgba(255, 255, 255, 0.7);
            transform: translateY(-1px);
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: currentColor;
            transition: width 0.3s ease;
        }

        .footer-links a:hover::after {
            width: 100%;
        }

        body.light-mode .footer-links a {
            color: rgba(26, 29, 35, 0.3);
        }

        body.light-mode .footer-links a:hover {
            color: rgba(26, 29, 35, 0.7);
        }

        .footer-copy {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.1em;
            font-weight: 300;
            transition: color 0.5s ease;
        }

        .footer-random-quote {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.05em;
            font-weight: 300;
            font-style: italic;
            text-align: center;
            transition: color 0.5s ease;
            cursor: pointer;
            user-select: none;
        }

        body.light-mode .footer-random-quote {
            color: rgba(26, 29, 35, 0.25);
        }

        /* 硬核编辑板块 */
        .hardcore-section {
            width: 100%;
            max-width: 820px;
            margin: 2rem auto;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            transition: border-color 0.5s ease;
        }

        .hardcore-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
            transition: color 0.5s ease;
        }

        .hardcore-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .hardcore-image {
            position: relative;
            flex: 0 0 auto;
            width: 75%;
            max-width: 750px;
            border-radius: 1.2rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            transition: border-color 0.5s ease;
        }

        .hardcore-image img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 叠加在图片上方的 SVG */
        .hardcore-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 520px;
            height: auto;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.05));
        }

        /* 默认（深色模式）：SVG 为浅色，与主题反向 */
        .hardcore-overlay path {
            stroke: #ffffff;
            transition: stroke 0.5s ease;
        }

        /* 浅色模式：SVG 为深色，与主题反向 */
        body.light-mode .hardcore-overlay path {
            stroke: #000000;
        }

        body.light-mode .hardcore-section {
            border-top-color: rgba(0, 0, 0, 0.08);
        }

        body.light-mode .hardcore-image {
            border-color: rgba(0, 0, 0, 0.08);
            background: rgba(0, 0, 0, 0.03);
        }

        body.light-mode .hardcore-title {
            color: rgba(26, 29, 35, 0.3);
        }

        body.light-mode .hardcore-overlay {
            filter: drop-shadow(0 0 24px rgba(0, 0, 0, 0.06));
        }

        @media (max-width: 600px) {
            .hardcore-panel {
                flex-direction: column;
                gap: 1.2rem;
            }
            .hardcore-image {
                width: 70%;
            }
            .hardcore-icon {
                justify-content: center;
            }
            .hardcore-icon svg {
                max-width: 320px;
            }
        }

        @media (max-width: 600px) {
            .main-wrapper {
                padding: 1.5rem 1rem 3rem;
            }
            .hero-section {
                min-height: 65vh;
            }
            .top-left-icon {
                top: 1rem;
                left: 1rem;
                width: 36px;
                height: 36px;
            }
            .top-left-icon svg {
                width: 30px;
            }
            .showcase-grid {
                grid-template-columns: 1fr 1fr;
            }
            .theme-toggle {
                top: 1rem;
                right: 1rem;
                width: 42px;
                height: 42px;
            }
            .theme-toggle svg {
                width: 20px;
                height: 20px;
            }
            .footer-links {
                gap: 1.2rem;
            }
            .footer-links a {
                font-size: 0.7rem;
            }
        }
        @media (max-width: 400px) {
            .showcase-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        <section class="hardcore-section">
            <div class="hardcore-title">✦ 硬核编辑 ✦</div>

                    <svg class="hardcore-overlay" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200.01993" height="108.74116" viewBox="0,0,200.01993,108.74116"><g transform="translate(-140.65552,-125.53659)"><g fill="none" stroke-width="6.5" stroke-linejoin="bevel" stroke-miterlimit="10"><path d="M142.4176,147.50729h15.01588l-13.65079,48.23285"/><path d="M155.15835,163.88826h20.93124"/><path d="M188.12693,181.84096h-15.01588l13.65079,-48.23285"/><path d="M207.19595,154.78772l-7.73545,26.39156h22.75135"/><path d="M217.86822,154.08431h22.75135l-7.73545,26.39156l22.54467,0.24838"/><path d="M266.10107,184.1161l7.73545,-30.94183h22.75135"/><path d="M307.96355,154.53934l-7.73545,26.39156h22.75135"/><path d="M304.52999,157.47616h22.75135l-7.73545,26.39156"/><path d="M334.85224,154.746h-6.37038l9.10054,-28.21165"/><path d="M200.78387,202.97882l-7.73545,26.39156h22.75135"/><path d="M197.35031,205.91565h22.75135l-7.73545,26.39156"/><path d="M158.21799,203.18549l-7.73545,26.39156h22.75135"/><path d="M154.3294,206.12231h22.75135l-2.20941,6.89562"/><path d="M172.02098,224.93755l-2.22066,7.57632"/><path d="M235.36588,233.46565l7.28043,-28.21167h22.75135"/><path d="M284.01205,202.48208l-7.73545,26.39156h22.75135"/><path d="M280.12346,205.41891h22.75135l-2.20941,6.89562"/><path d="M301.57546,210.4242l-2.34087,6.89562h-21.38626"/></g></g></svg>

            <div class="footer-random-quote" id="randomQuote" title="点击换一条">rw大舞台，敢发你就来 — DL_Grass</div>

    </div>

    <script>
        (function() {
            // ---- 粒子背景 ----
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 70;
            const COLOR = '#75c1c4';
            const MAX_SPEED = 1.4;
            const MIN_SPEED = 0.3;
            const MAX_RADIUS = 4.0;
            const MIN_RADIUS = 1.2;
            const LIFE_SPAN = 200;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                initParticles(true);
            }

            class Particle {
                constructor(init = false) {
                    this.reset(init);
                }

                reset(init = false) {
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const spread = 40;
                    this.x = centerX + (Math.random() - 0.5) * spread;
                    this.y = centerY + (Math.random() - 0.5) * spread;

                    const angle = Math.random() * 2 * Math.PI;
                    const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;

                    this.radius = MIN_RADIUS + Math.random() * (MAX_RADIUS - MIN_RADIUS);
                    this.life = init ? Math.floor(Math.random() * LIFE_SPAN) : 0;
                    this.maxLife = LIFE_SPAN + Math.floor(Math.random() * 50);
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    this.vx += (Math.random() - 0.5) * 0.03;
                    this.vy += (Math.random() - 0.5) * 0.03;
                    const sp = Math.hypot(this.vx, this.vy);
                    if (sp > MAX_SPEED * 1.6) {
                        this.vx = (this.vx / sp) * MAX_SPEED * 1.2;
                        this.vy = (this.vy / sp) * MAX_SPEED * 1.2;
                    }

                    this.life++;
                    const margin = 120;
                    if (this.life > this.maxLife ||
                        this.x < -margin || this.x > width + margin ||
                        this.y < -margin || this.y > height + margin) {
                        this.reset(false);
                    }
                }

                draw() {
                    const progress = this.life / this.maxLife;
                    let alpha;
                    if (progress < 0.15) {
                        alpha = progress / 0.15;
                    } else {
                        alpha = 1 - (progress - 0.15) / 0.85;
                    }
                    alpha = Math.min(1, Math.max(0, alpha)) * 0.8;

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = COLOR;
                    ctx.globalAlpha = alpha;
                    ctx.fill();
                    if (this.radius > 2.5) {
                        ctx.shadowColor = COLOR;
                        ctx.shadowBlur = 8;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    ctx.globalAlpha = 1.0;
                }
            }

            function initParticles(forceReset = false) {
                if (forceReset || particles.length === 0) {
                    particles = [];
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        particles.push(new Particle(true));
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let p of particles) {
                    p.update();
                    p.draw();
                }
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            resize();
            animate();

            // ---- 主题切换功能 ----
            const toggleBtn = document.getElementById('themeToggle');
            const moonIcon = document.getElementById('moonIcon');
            const sunIcon = document.getElementById('sunIcon');
            const body = document.body;

            // 获取左上角图标和文字SVG
            const topIconSvg = document.querySelector('.top-left-icon svg');
            const textLogoSvg = document.getElementById('logoSvg');

            function updateSvgColors(isLightMode) {
                const color = isLightMode ? '#000000' : '#ffffff';
                
                // 更新左上角图标
                const iconPaths = topIconSvg.querySelectorAll('path');
                iconPaths.forEach(path => {
                    if (path.hasAttribute('stroke')) {
                        path.setAttribute('stroke', color);
                    }
                });
                const iconGroups = topIconSvg.querySelectorAll('g');
                iconGroups.forEach(g => {
                    if (g.hasAttribute('stroke')) {
                        g.setAttribute('stroke', color);
                    }
                });

                // 更新文字标识
                const textPaths = textLogoSvg.querySelectorAll('path');
                textPaths.forEach(path => {
                    if (path.hasAttribute('stroke')) {
                        path.setAttribute('stroke', color);
                    }
                });
                const textGroups = textLogoSvg.querySelectorAll('g');
                textGroups.forEach(g => {
                    if (g.hasAttribute('stroke')) {
                        g.setAttribute('stroke', color);
                    }
                });
            }

            let isLightMode = false;

            function toggleTheme() {
                isLightMode = !isLightMode;
                
                body.classList.toggle('light-mode', isLightMode);
                updateSvgColors(isLightMode);
                updateHardcoreImage(isLightMode);
                
                if (isLightMode) {
                    moonIcon.style.display = 'none';
                    sunIcon.style.display = 'block';
                } else {
                    moonIcon.style.display = 'block';
                    sunIcon.style.display = 'none';
                }
            }

            const hardcoreImg = document.getElementById('hardcoreImg');

            function updateHardcoreImage(isLightMode) {
                hardcoreImg.src = isLightMode ? 'yhw.png' : 'yh.png';
            }

            toggleBtn.addEventListener('click', toggleTheme);
            updateSvgColors(false);
            updateHardcoreImage(false);

            // ---- 随机语句功能 ----
            const quotes = [
                "rw大舞台，敢发你就来 — DL_Grass",
                "美好作品火化冒烟，Bug首选重构跃迁 — 笑小朗",
                "这里没有开发者，或者开发的都不是人 — DL_Grass",
                "雷霆代码集体蹦迪，神秘作品鬼火漂移 — DL_Grass",
                "重构跃迁，特别阴间 — 笑小朗",
                "bug爆炸，说走就走 — DL_Grass",
                "重构跃迁，法力无边 — 笑小朗",
                "重构跃迁，游戏之巅 — 笑小朗",
                "重构跃迁，抄袭无边 — 笑小朗",
                "重构跃迁，抄袭为先 — 笑小朗",
                "重构跃迁，制为先 — DL_Grass",
                "重构跃迁，同步为先 — 勇敢的菠萝",
                "喜欢吃屎的可以用rw — PPN-design",
                "RW之大无奇不有 — DL_Grass",
                "你给用户一坨屎不如啥也不给 — PPN-design",
                "在 🪨里做💩更有味道 — ⑧度空间（10000why）",
                "编辑器强弱新比较单位：\"rw\" — 复称重呢会有都没（程序猿windows）"
            ];

            const quoteElement = document.getElementById('randomQuote');
            let lastIndex = 0;

            function showRandomQuote() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * quotes.length);
                } while (newIndex === lastIndex && quotes.length > 1);
                lastIndex = newIndex;
                quoteElement.textContent = quotes[newIndex];
            }

            quoteElement.addEventListener('click', showRandomQuote);

        })();
    </script>
